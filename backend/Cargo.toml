[package]
name = "ouroboros-autoseg-plugin-backend"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
cuda = [
    "candle-core/cuda",
    "candle-nn/cuda",
    "sam3/cuda",
]
cudnn = [
    "cuda",
    "candle-core/cudnn",
    "candle-nn/cudnn",
    "sam3/cudnn",
]

[dependencies]
async-trait = "=0.1.77"
# Candle from the den-sq fork, at the same commit candle-sam3 pins, so both use one set of Candle types.
candle-core = { git = "https://github.com/den-sq/candle", rev = "9af0337b7784d638c14f3234b0ebca0971768207" }
candle-nn = { git = "https://github.com/den-sq/candle", rev = "9af0337b7784d638c14f3234b0ebca0971768207" }
# SAM 3 engine; distributed under the SAM License (see the crate's LICENSE-SAM).
sam3 = { package = "candle-sam3", git = "https://github.com/den-sq/candle-sam3", rev = "8d762350304f683a35215aa1d2c8d71d845f3be3" }
axum = { version = "=0.6.20", features = ["json", "macros"] }
futures-util = "=0.3.31"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "tiff"] }
indexmap = "=2.2.6"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.111"
thiserror = "=1.0.56"
tokio = { version = "=1.35.1", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "=0.4.4", features = ["cors", "trace"] }
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter", "fmt"] }
url = "=2.4.1"
uuid = { version = "=1.6.1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.10.1"
