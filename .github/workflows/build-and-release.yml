name: Build and Release Plugin

on:
  pull_request:
    paths:
      - .github/workflows/build-and-release.yml
      - package.json
      - package-lock.json
      - scripts/**
      - tests/**
      - tsconfig*.json
      - vite.config.ts
      - src/**
      - backend/**
      - public/**
  push:
    tags:
      - v*.*.*

env: 
  GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
  REGISTRY_IMAGE: ghcr.io/chenglabresearch/ouroboros-autoseg-backend


jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    env:
      OUROBOROS_AUTOSEG_PLUGIN_RELEASE_TAG: v0.4.0-beta.3-ci

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Audit dependencies
        if: runner.os == 'Linux'
        run: npm audit --audit-level=moderate

      - name: Build release layouts
        run: npm run build:release

      - name: Validate release layouts
        run: npm run validate:release

  plugin-artifacts:
    needs: regression
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm
        run: npm install --global npm@11.19.0

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Docker Buildx for release promotion
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for release promotion
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and promote main backend images
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          release_commit="$(git rev-parse HEAD)"
          cpu_commit_image="${REGISTRY_IMAGE}:sha-${release_commit}"
          cuda_commit_image="${REGISTRY_IMAGE}:sha-${release_commit}-cuda"

          cpu_digest="$(docker buildx imagetools inspect "${cpu_commit_image}" --format '{{.Manifest.Digest}}')" || {
            echo "No verified main CPU image exists for ${release_commit}" >&2
            exit 1
          }
          cuda_digest="$(docker buildx imagetools inspect "${cuda_commit_image}" --format '{{.Manifest.Digest}}')" || {
            echo "No verified main CUDA image exists for ${release_commit}" >&2
            exit 1
          }

          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}" \
            "${REGISTRY_IMAGE}@${cpu_digest}"
          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}-cuda" \
            "${REGISTRY_IMAGE}@${cuda_digest}"

          printf '%s\n' \
            "OUROBOROS_AUTOSEG_BACKEND_CPU_DIGEST=${cpu_digest}" \
            "OUROBOROS_AUTOSEG_BACKEND_CUDA_DIGEST=${cuda_digest}" \
            "OUROBOROS_AUTOSEG_PLUGIN_COMMIT=${release_commit}" \
            >> "${GITHUB_ENV}"

          printf 'Release backend images\n\n- CPU: `%s@%s`\n- CUDA: `%s@%s`\n' \
            "${REGISTRY_IMAGE}" "${cpu_digest}" \
            "${REGISTRY_IMAGE}" "${cuda_digest}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Set artifact names
        run: |
          safe_ref="${GITHUB_REF_NAME//\//-}"
          printf '%s\n' \
            "CPU_ARTIFACT=auto-segmentation-${safe_ref}-cpu.zip" \
            "CUDA_ARTIFACT=auto-segmentation-${safe_ref}-cuda.zip" \
            "OUROBOROS_AUTOSEG_PLUGIN_RELEASE_TAG=${GITHUB_REF_NAME}" \
            >> "$GITHUB_ENV"

      - name: Build release layouts
        run: npm run build:release

      - name: Validate release layouts
        run: npm run validate:release

      - name: Archive CPU release
        working-directory: dist-artifacts/auto-segmentation-cpu
        run: zip -r "../${CPU_ARTIFACT}" .

      - name: Archive CUDA release
        working-directory: dist-artifacts/auto-segmentation-cuda
        run: zip -r "../${CUDA_ARTIFACT}" .

      - name: Validate release archives
        run: |
          npm run validate:archive -- "dist-artifacts/${CPU_ARTIFACT}" cpu
          npm run validate:archive -- "dist-artifacts/${CUDA_ARTIFACT}" cuda

      - name: Upload CPU artifact for PR validation
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CPU_ARTIFACT }}
          path: dist-artifacts/${{ env.CPU_ARTIFACT }}

      - name: Upload CUDA artifact for PR validation
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CUDA_ARTIFACT }}
          path: dist-artifacts/${{ env.CUDA_ARTIFACT }}

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1.21.0
        with:
          artifacts: |
            dist-artifacts/${{ env.CPU_ARTIFACT }}
            dist-artifacts/${{ env.CUDA_ARTIFACT }}
          token: ${{ secrets.GITHUB_TOKEN }}
