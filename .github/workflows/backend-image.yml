name: Backend Dockerfile Before Control (do not merge)

on:
  push:
    branches: [codex/103-before-dockerfile]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  measure:
    name: Registry before / ${{ matrix.variant }} / Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            runtime: runtime
            cache_digest: sha256:71f3dc4b8bb1ed7d650ef04993a4395e4fc785ba6c2500561362b012c5f7131b
          - variant: cuda
            runtime: cuda-runtime
            cache_digest: sha256:e6c0d93b01b2ef1a02f06d5ae12ad1d07dfbbca2e4f2a045a7f208ce2b45c1b8
    env:
      VARIANT: ${{ matrix.variant }}
      RUNTIME: ${{ matrix.runtime }}
      CACHE_REF: ghcr.io/chenglabresearch/ouroboros-autoseg-backend@${{ matrix.cache_digest }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: f8cfcecd93f17121c19c94d8c5f510264b296b23
          persist-credentials: false

      - name: Insert one neutral instruction above dependency compilation
        run: |
          set -euo pipefail
          export MEASUREMENTS="${RUNNER_TEMP}/dockerfile-before"
          echo "MEASUREMENTS=${MEASUREMENTS}" >> "${GITHUB_ENV}"
          mkdir -p "${MEASUREMENTS}"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFile, writeFile } from 'node:fs/promises'
          import { join } from 'node:path'
          import { parseDockerfile } from './scripts/backend-build-fingerprint.mjs'
          const variant = process.env.VARIANT
          const text = await readFile('backend/Dockerfile', 'utf8')
          const parsed = parseDockerfile(text)
          const stage = parsed.stages.find(({ name }) => name === (variant === 'cpu' ? 'builder' : 'cuda-builder'))
          const marker = 'COPY Cargo.toml Cargo.lock ./'
          const original = stage.lines.join('\n')
          assert.equal(original.split(marker).length, 2)
          const changed = original.replace(marker, `RUN true\n${marker}`)
          await writeFile('backend/Dockerfile', text.replace(original, changed))
          // Keep the old Dockerfile's exact image pins and native configuration.
          // This RUN sits below native setup, above dependency compilation.
          const baseImages = Object.fromEntries([...parsed.globalArgs].filter(([name]) => name.endsWith('_IMAGE')))
          assert(Object.values(baseImages).every((image) => /@sha256:[0-9a-f]{64}$/.test(image)))
          await writeFile(join(process.env.MEASUREMENTS, 'inputs.json'), JSON.stringify({
            revision: 'f8cfcecd93f17121c19c94d8c5f510264b296b23', variant,
            cache: process.env.CACHE_REF, platform: 'linux/amd64', baseImages,
            mutation: 'Insert RUN true immediately before the selected builder stage COPY Cargo.toml Cargo.lock ./; no native environment or dependency changes.',
            comparison: 'The after trial reorders cargo-about install options above dependency compilation. These are distinct neutral Dockerfile edits, not identical textual perturbations.'
          }, null, 2) + '\n')
          NODE
          git diff -- backend/Dockerfile > "${MEASUREMENTS}/input-change.txt"
          cp backend/Dockerfile "${MEASUREMENTS}/Dockerfile"

      - name: Set up Docker Buildx
        id: builder
        uses: docker/setup-buildx-action@v3

      - name: Log in for read-only cache access
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the frozen registry control cache
        run: |
          set -euo pipefail
          # Digests are from run 44875505417's registry seed exports. Refuse a
          # missing control before any build; never seed or use a moving tag.
          if ! docker buildx imagetools inspect --raw "${CACHE_REF}" > "${MEASUREMENTS}/registry-manifest.json"; then
            echo 'Frozen registry control cache is unavailable; refusing an unseeded comparison.' >&2
            exit 1
          fi

      - name: Build the old test and runtime graphs without publishing
        env:
          BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          set -euo pipefail
          build=(docker buildx build --builder "${BUILDER}" --platform linux/amd64
            --file backend/Dockerfile --progress plain --output type=cacheonly
            --cache-from "type=registry,ref=${CACHE_REF}")
          printf 'target\tstart_ns\tend_ns\n' > "${MEASUREMENTS}/timings.tsv"
          targets=("${RUNTIME}")
          if [[ "${VARIANT}" == cpu ]]; then targets=(test "${RUNTIME}"); fi
          # Preserve the old separate CPU test solve followed by runtime.
          # CUDA runtime retains its existing feature/cuDNN-linkage checks.
          for target in "${targets[@]}"; do
            started="$(date +%s%N)"
            "${build[@]}" --target "${target}" backend 2>&1 | tee "${MEASUREMENTS}/${target}.log"
            printf '%s\t%s\t%s\n' "${target}" "${started}" "$(date +%s%N)" >> "${MEASUREMENTS}/timings.tsv"
          done

      - name: Upload measurements only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-before-dockerfile-${{ matrix.variant }}
          path: ${{ runner.temp }}/dockerfile-before/
          retention-days: 14
          if-no-files-found: warn
