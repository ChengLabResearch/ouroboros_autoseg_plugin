name: Backend Hybrid Cache Measurement (do not merge)

on:
  workflow_dispatch:
    inputs:
      production_ref:
        description: Exact production commit; its CPU and CUDA CI builds must have passed
        required: true
        default: 2cede59faa7470da0948b91635997f6371f538a9
        type: string

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: backend-hybrid-measurement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seed:
    name: Bootstrap / ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    env:
      PRODUCTION_REF: ${{ inputs.production_ref }}
      CANONICAL_CACHE: ghcr.io/chenglabresearch/ouroboros-autoseg-backend:buildcache-${{ matrix.variant }}
    steps:
      - name: Check out the production commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.production_ref }}
          persist-credentials: false

      - name: Check out branch-only measurement inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .measurement-harness
          persist-credentials: false

      - name: Set up Docker Buildx
        id: builder
        uses: docker/setup-buildx-action@v3

      - name: Log in for registry reads only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate canonical records locally
        id: prepare
        run: node .measurement-harness/.github/measurement/prepare.mjs '${{ matrix.variant }}' seed

      - name: Bootstrap archive from the verified registry layer
        id: cache
        uses: ./.github/actions/backend-dependency-cache
        with:
          phase: restore
          variant: ${{ matrix.variant }}
          builder: ${{ steps.builder.outputs.name }}
          candidate-exists: 'true'
          is-main: 'true'
          can-publish: 'true'

      - name: Require bootstrap without dependency compilation
        env:
          SAVE: ${{ steps.cache.outputs.save }}
          CACHE_FROM: ${{ steps.cache.outputs.cache-from }}
        run: |
          set -euo pipefail
          if [[ "${SAVE}" != true || "${CACHE_FROM}" != type=registry,ref=*@sha256:* ]]; then
            echo 'The registry dependency layer was not reusable, or this diagnostic ref already has the archive. No fallback backend build is allowed. Use a fresh diagnostic branch and verify the production CI cache is available.' >&2
            exit 1
          fi

      - name: Save the existing dependency snapshot
        uses: ./.github/actions/backend-dependency-cache
        with:
          phase: save
          variant: ${{ matrix.variant }}
          builder: ${{ steps.builder.outputs.name }}
          can-publish: 'true'
          cache-from: ${{ steps.cache.outputs.cache-from }}

      - name: Require the exact archive before launching probes
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/backend-cargo-${{ matrix.variant }}
          key: ${{ steps.prepare.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Record the immutable registry input
        env:
          VARIANT: ${{ matrix.variant }}
          NAMESPACE: ${{ steps.prepare.outputs.namespace }}
          CACHE_FROM: ${{ steps.cache.outputs.cache-from }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises'
          import { join } from 'node:path'
          const seed = { productionRef: process.env.PRODUCTION_REF, variant: process.env.VARIANT, namespace: process.env.NAMESPACE, cacheFrom: process.env.CACHE_FROM }
          await writeFile(join(process.env.RUNNER_TEMP, 'measurements', 'seed.json'), `${JSON.stringify(seed, null, 2)}\n`)
          NODE

      - name: Publish seed metadata for the fresh runners
        uses: actions/upload-artifact@v7
        with:
          name: hybrid-seed-${{ matrix.variant }}
          path: ${{ runner.temp }}/measurements/seed.json
          if-no-files-found: error

      - name: Upload measurement evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hybrid-bootstrap-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/measurements/*
            ${{ runner.temp }}/backend-dependency-cache-*/*.jsonl
          retention-days: 14
          if-no-files-found: warn

  probe:
    name: Probe / ${{ matrix.variant }} / ${{ matrix.scenario }}
    needs: seed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [cpu, cuda]
        scenario: [source, dependency, dockerfile]
    env:
      PRODUCTION_REF: ${{ inputs.production_ref }}
    steps:
      - name: Check out the production commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.production_ref }}
          persist-credentials: false

      - name: Check out branch-only measurement inputs
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .measurement-harness
          persist-credentials: false

      - name: Download the pinned seed input
        uses: actions/download-artifact@v8
        with:
          name: hybrid-seed-${{ matrix.variant }}
          path: ${{ runner.temp }}/seed-metadata

      - name: Set up Docker Buildx
        id: builder
        uses: docker/setup-buildx-action@v3

      - name: Log in for registry reads only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply the real-input probe and recompute its record
        id: prepare
        run: node .measurement-harness/.github/measurement/prepare.mjs '${{ matrix.variant }}' '${{ matrix.scenario }}'

      - name: Restore through the production cache action
        id: cache
        uses: ./.github/actions/backend-dependency-cache
        with:
          phase: restore
          variant: ${{ matrix.variant }}
          builder: ${{ steps.builder.outputs.name }}
          candidate-exists: 'false'
          is-main: 'false'
          can-publish: 'false'

      - name: Build the verified runtime without publishing
        env:
          BUILDER: ${{ steps.builder.outputs.name }}
          VARIANT: ${{ matrix.variant }}
          RECORD: ${{ steps.prepare.outputs.record }}
          RUNTIME: ${{ steps.prepare.outputs.runtime }}
          NAMESPACE: ${{ steps.cache.outputs.namespace }}
          PLATFORM: ${{ steps.cache.outputs.platform }}
          CACHE_FROM: ${{ steps.cache.outputs.cache-from }}
        run: |
          set -euo pipefail
          test -n "${CACHE_FROM}"
          builder_stage=builder
          runtime_stage=runtime
          if [[ "${VARIANT}" == cuda ]]; then
            builder_stage=cuda-builder
            runtime_stage=cuda-runtime
          fi
          pinned_image() {
            jq -r --arg stage "$1" '.baseImages[] | select(.stage == $stage) | (.image | split("@")[0]) + "@" + .digest' "${RECORD}"
          }
          started="$(date +%s%N)"
          docker buildx build --builder "${BUILDER}" --platform "${PLATFORM}" \
            --file backend/Dockerfile --target "${RUNTIME}" --progress plain \
            --build-arg "BACKEND_CACHE_NAMESPACE=${NAMESPACE}" \
            --build-arg "${VARIANT^^}_BUILDER_IMAGE=$(pinned_image "${builder_stage}")" \
            --build-arg "${VARIANT^^}_RUNTIME_IMAGE=$(pinned_image "${runtime_stage}")" \
            --cache-from "${CACHE_FROM}" --output type=cacheonly backend \
            2>&1 | tee "${RUNNER_TEMP}/measurements/build.log"
          finished="$(date +%s%N)"
          printf 'build_started_ns=%s\nbuild_finished_ns=%s\nbuild_elapsed_ns=%s\n' \
            "${started}" "${finished}" "$((finished - started))" > "${RUNNER_TEMP}/measurements/build-timing.txt"

      - name: Upload measurement evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hybrid-probe-${{ matrix.variant }}-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/measurements/*
            ${{ runner.temp }}/backend-dependency-cache-*/*.jsonl
          retention-days: 14
          if-no-files-found: warn
