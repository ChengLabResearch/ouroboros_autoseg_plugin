name: Backend Cache Spike (do not merge)

on:
  pull_request:
    paths:
      - .github/workflows/backend-cache-spike*.yml
      - .github/cache-spike/**

permissions:
  contents: read
  packages: write
  actions: read

concurrency:
  group: backend-cache-spike-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  seed:
    if: github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    uses: ./.github/workflows/backend-cache-spike-run.yml
    with:
      method: &spike-method hybrid
      variant: ${{ matrix.variant }}
      scenario: seed

  probe:
    needs: seed
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [cpu, cuda]
        scenario: [source, dependency]
    uses: ./.github/workflows/backend-cache-spike-run.yml
    with:
      method: *spike-method
      variant: ${{ matrix.variant }}
      scenario: ${{ matrix.scenario }}
